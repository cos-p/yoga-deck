name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run safe test suite
        run: pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
